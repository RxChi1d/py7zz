name: CI

on:
  push:
    branches: ["**"]  # All branches
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --dev
        uv pip install -e .

    - name: Run ruff check
      run: uv run ruff check . --output-format=github

    - name: Run ruff format check
      run: uv run ruff format --check --diff .

    - name: REUSE compliance check
      run: pipx run reuse lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Ubuntu: comprehensive testing across all supported Python versions
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          # Windows: test key versions (minimum and maximum supported)
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.13"
          # macOS: test intermediate version for additional platform validation
          - os: macos-latest
            python-version: "3.11"
          # Linux ARM64: sampled coverage (minimum and maximum supported)
          - os: ubuntu-24.04-arm
            python-version: "3.8"
          - os: ubuntu-24.04-arm
            python-version: "3.13"
          # Windows ARM64: sampled coverage. Native Windows ARM64 Python exists
          # only for 3.11+, so the minimum sample is 3.11 instead of 3.8.
          - os: windows-11-arm
            python-version: "3.11"
          - os: windows-11-arm
            python-version: "3.13"
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: true

    # Reason: windows-11-arm has no uv-managed native ARM64 Python builds via the
    # default path used historically, so use actions/setup-python (native ARM64,
    # Python 3.11+) and point uv at that system interpreter. All other runners
    # keep the uv-managed Python install.
    - name: Set up Python ${{ matrix.python-version }} (setup-python, ARM64)
      if: matrix.os == 'windows-11-arm'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Python ${{ matrix.python-version }} (uv-managed)
      if: matrix.os != 'windows-11-arm'
      run: uv python install ${{ matrix.python-version }}

    # Reason: export via GITHUB_ENV so every subsequent uv invocation (sync,
    # pytest, mypy) binds to the native ARM64 setup-python interpreter; per-step
    # env would leave later 'uv run' steps free to resolve a different one.
    - name: Configure uv to use system Python (windows-11-arm)
      if: matrix.os == 'windows-11-arm'
      shell: bash
      run: |
        echo "UV_PYTHON_PREFERENCE=only-system" >> "$GITHUB_ENV"
        echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
        echo "UV_PYTHON=${pythonLocation}/python.exe" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: |
        uv sync --dev
        uv pip install -e .

    - name: Download 7zz binary for testing
      shell: bash
      run: |
        # Reason: download logic now has a single source of truth in get_7zz.sh.
        # Platform/arch are passed explicitly from runner.os/runner.arch instead
        # of relying on the script's uname-based auto-detection: on windows-11-arm
        # the Git Bash toolchain is x64-emulated and 'uname -m' reports x86_64,
        # which would silently download the x64 binary and fake the ARM coverage.
        case "${{ runner.os }}" in
          Linux)   OS_ARG="linux" ;;
          Windows) OS_ARG="windows" ;;
          macOS)   OS_ARG="macos" ;;
          *) echo "Unsupported runner OS: ${{ runner.os }}"; exit 1 ;;
        esac
        if [[ "$OS_ARG" == "macos" ]]; then
          ARCH_ARG="universal2"
        elif [[ "${{ runner.arch }}" == "ARM64" ]]; then
          ARCH_ARG="arm64"
        else
          ARCH_ARG="x86_64"
        fi

        chmod +x scripts/get_7zz.sh
        ./scripts/get_7zz.sh --os "$OS_ARG" --arch "$ARCH_ARG"

        # Short fatal verification: the binary must exist and be runnable.
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          BINARY_PATH="py7zz/bin/7zz.exe"
          HELP_FLAG="-h"
        else
          BINARY_PATH="py7zz/bin/7zz"
          HELP_FLAG="--help"
        fi

        if [[ ! -f "$BINARY_PATH" ]]; then
          echo "Error: 7zz binary not found at $BINARY_PATH"
          exit 1
        fi

        if [[ "${{ runner.os }}" == "Windows" ]] && [[ ! -f "py7zz/bin/7z.dll" ]]; then
          echo "Error: 7z.dll not found alongside the Windows binary"
          exit 1
        fi

        if ! "$BINARY_PATH" "$HELP_FLAG" > /dev/null 2>&1; then
          echo "Error: 7zz binary at $BINARY_PATH failed to run"
          exit 1
        fi
        echo "7zz binary verified at $BINARY_PATH"

    - name: Run pytest
      shell: bash
      run: uv run pytest -v --tb=short

    - name: Run mypy
      shell: bash
      run: uv run mypy .

  build-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install build dependencies
      run: |
        uv sync --dev
        uv pip install build

    - name: Build wheel and sdist
      run: uv run python -m build

    - name: Check wheel contents
      run: |
        WHL=$(ls dist/*.whl | head -n1)
        echo "Checking wheel contents: $WHL"
        unzip -l "$WHL" | grep -E "(LICENSE|THIRD_PARTY_NOTICES\.md|licenses/7zip-LICENSE\.txt)" || {
          echo "❌ Missing required license files in wheel"
          echo "Wheel contents:"
          unzip -l "$WHL"
          exit 1
        }
        echo "✅ All required license files found in wheel"

    - name: Check sdist contents
      run: |
        SDIST=$(ls dist/*.tar.gz | head -n1)
        echo "Checking sdist contents: $SDIST"
        tar tzf "$SDIST" | grep -E "(LICENSE|THIRD_PARTY_NOTICES\.md|licenses/7zip-LICENSE\.txt)" || {
          echo "❌ Missing required license files in sdist"
          echo "Sdist contents:"
          tar tzf "$SDIST"
          exit 1
        }
        echo "✅ All required license files found in sdist"

    - name: Install and test wheel
      run: |
        WHL=$(ls dist/*.whl | head -n1)
        uv pip install "$WHL"
        uv run python -c "import py7zz; print('✅ Wheel installation successful')"

  sbom-generation:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install SBOM and license tools
      run: |
        uv sync --dev
        uv add --dev cyclonedx-bom pip-licenses

    - name: Generate SBOM
      run: |
        uv run cyclonedx-py environment .venv -o sbom.json --output-format=json
        echo "✅ SBOM generated: sbom.json"

    - name: Generate dependency licenses report
      run: |
        uv run pip-licenses --format=markdown > licenses-dependencies.md
        echo "✅ Dependency licenses generated: licenses-dependencies.md"

    - name: Upload SBOM and licenses as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compliance-reports
        path: |
          sbom.json
          licenses-dependencies.md
        retention-days: 90
