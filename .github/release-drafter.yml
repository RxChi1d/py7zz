name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  # Reason: release-drafter v7 models exclusion and version bumps as
  # categories; the top-level exclude-labels / version-resolver.*.labels
  # fields are deprecated.
  - type: 'pre-exclude'
    when:
      labels:
        - 'skip-changelog'
        - 'dependencies'
  # Order follows Conventional Changelog (Angular preset) specification
  - title: '🚀 Features'
    when:
      labels:
        - 'feat'
        - 'feature'
        - 'enhancement'
  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bug'
        - 'bugfix'
  - title: '⚡ Performance Improvements'
    when:
      labels:
        - 'perf'
        - 'performance'
  - title: '↩️ Reverts'
    when:
      labels:
        - 'revert'
  - title: '📚 Documentation'
    when:
      labels:
        - 'docs'
        - 'documentation'
  - title: '🎨 Styles'
    when:
      labels:
        - 'style'
  - title: '♻️ Code Refactoring'
    when:
      labels:
        - 'refactor'
  - title: '🧪 Tests'
    when:
      labels:
        - 'test'
        - 'testing'
  - title: '🏗️ Build System'
    when:
      labels:
        - 'build'
        - 'deps'
  - title: '🔄 Continuous Integration'
    when:
      labels:
        - 'ci'
        - 'cd'
        - 'workflow'
  - title: '🔧 Maintenance'
    when:
      labels:
        - 'chore'
        - 'maintenance'
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - 'major'
        - 'breaking'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - 'minor'
        - 'feat'
        - 'feature'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'patch'
        - 'fix'
        - 'bug'
        - 'bugfix'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
category-template: '### $TITLE'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  default: patch
autolabeler:
  - label: 'feat'
    title:
      - '/^feat(\(.+\))?: .+/'
      - '/^feat(\(.+\))?!: .+/'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?: .+/'
      - '/^fix(\(.+\))?!: .+/'
  - label: 'docs'
    title:
      - '/^docs(\(.+\))?: .+/'
      - '/^docs(\(.+\))?!: .+/'
  - label: 'chore'
    title:
      - '/^chore(\(.+\))?: .+/'
      - '/^chore(\(.+\))?!: .+/'
  - label: 'test'
    title:
      - '/^test(\(.+\))?: .+/'
      - '/^test(\(.+\))?!: .+/'
  - label: 'ci'
    title:
      - '/^ci(\(.+\))?: .+/'
      - '/^ci(\(.+\))?!: .+/'
  - label: 'perf'
    title:
      - '/^perf(\(.+\))?: .+/'
      - '/^perf(\(.+\))?!: .+/'
  - label: 'refactor'
    title:
      - '/^refactor(\(.+\))?: .+/'
      - '/^refactor(\(.+\))?!: .+/'
  - label: 'style'
    title:
      - '/^style(\(.+\))?: .+/'
      - '/^style(\(.+\))?!: .+/'
  - label: 'revert'
    title:
      - '/^revert(\(.+\))?: .+/'
      - '/^revert(\(.+\))?!: .+/'
  - label: 'build'
    title:
      - '/^build(\(.+\))?: .+/'
      - '/^build(\(.+\))?!: .+/'
template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
